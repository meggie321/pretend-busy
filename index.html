<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>假装很忙 · Pretend To Be Busy</title>
<style>
  html,body{margin:0;height:100%;background:#0b1016;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#0b1016;box-shadow:0 0 80px rgba(0,0,0,.85);border-radius:8px;
    touch-action:none;cursor:pointer;}
  #selftest-result{position:fixed;left:0;top:0;margin:0;padding:10px;max-height:100vh;
    overflow:auto;background:#04070b;color:#7dff9b;font:12px/1.6 Consolas,monospace;
    white-space:pre;z-index:9;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<pre id="selftest-result" hidden></pre>
<script>
'use strict';
/* =====================================================================
   假装很忙 —— 2D 办公室摸鱼反应小游戏（单文件 HTML5，离线可运行）
   玩法：老板靠近前把屏幕从「摸鱼」切到「工作」，并收好泡面 / 手机。
   需求对照见同目录 README.md
   ===================================================================== */

/* ---------------------------- 基础工具 ---------------------------- */
const W = 1280, H = 720;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const Q = new URLSearchParams(location.search);

const rnd   = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lerp  = (a, b, t) => a + (b - a) * t;
const sign  = v => (v < 0 ? -1 : 1);

function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr;
  cv.height = H * dpr;
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function circle(x, y, r, c) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); }
function txt(s, x, y, size, color, align, weight) {
  ctx.fillStyle = color || '#22303c';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = (weight ? weight + ' ' : '') + size + 'px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.fillText(s, x, y);
}

/* ---------------------------- 数值配置 ----------------------------
   难度递增：移动速度 / 出场间隔 / 检查停留时长 / 双老板概率 随时间变化
   ------------------------------------------------------------------ */
const CFG = {
  easy: {
    key: 'easy', name: '摸鱼实习生', tag: '3 分钟 · 老板比较温柔', stars: 1,
    shift: 180, quota: 150,
    speed: [70, 150], spawn: [10.0, 14.0], check: [1.00, 1.50],
    speedRamp: 14, spawnRamp: 0.55, checkRamp: 0.10,
    doubleFrom: 2.5, doubleChance: 0.10,
    events: { turnBack: 0.10, ring: 0.16, blackout: 0.10, wave: 0.30 }
  },
  normal: {
    key: 'normal', name: '普通社畜', tag: '5 分钟 · 标准体验', stars: 2,
    shift: 300, quota: 300,
    speed: [92, 210], spawn: [7.5, 11.0], check: [1.25, 1.90],
    speedRamp: 22, spawnRamp: 0.80, checkRamp: 0.15,
    doubleFrom: 3.0, doubleChance: 0.16,
    events: { turnBack: 0.16, ring: 0.22, blackout: 0.14, wave: 0.28 }
  },
  hard: {
    key: 'hard', name: '困难打工人', tag: '5 分钟 · 摸鱼指标 600', stars: 3,
    shift: 300, quota: 600,
    speed: [115, 245], spawn: [5.5, 8.5], check: [1.50, 2.20],
    speedRamp: 26, spawnRamp: 0.95, checkRamp: 0.18,
    doubleFrom: 1.5, doubleChance: 0.26,
    events: { turnBack: 0.24, ring: 0.28, blackout: 0.18, wave: 0.24 }
  }
};

const ACHS = [
  { id: 'survivor',     name: '成功下班', desc: '撑到下班且完成摸鱼指标' },
  { id: 'never_caught', name: '从未被抓', desc: '一局内零被抓' },
  { id: 'slack_master', name: '摸鱼大师', desc: '单局摸鱼积分达到 800' },
  { id: 'actor',        name: '影帝',     desc: '一局内 3 次桌面收拾得干干净净' },
  { id: 'combo',        name: '连击王',   desc: '达成 5 连击' },
  { id: 'fired',        name: '被开除',   desc: '被抓 3 次或积分归零' }
];

const SAVE_KEY = 'jiazhuanghenmang.save.v1';
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
function saveSave(o) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); } catch (e) { /* file:// 下可能不可用 */ } }

/* ---------------------------- 全局状态 ---------------------------- */
const G = {
  state: 'menu',            // menu | playing | paused | result
  diffKey: 'normal', cfg: CFG.normal,
  t: 0, timeLeft: 300,
  points: 70, catches: 0, combo: 0, maxCombo: 0,
  success: 0, hiddenCount: 0, doubleHide: 0,
  screen: 'slack', switchAnim: 0, slackIdx: 0, workIdx: 0, sceneT: 0,
  items: { noodle: true, phone: true }, calmT: 0,
  bosses: [], warns: [], spawnTimer: 6, eventTimer: 22,
  blackout: 0, ring: 0, ringT: 0, wave: null,
  msgs: [], events: [], buttons: [], shake: 0, flash: 0, frozen: false,
  outcome: null, reason: '', rating: null, newAchs: [], saved: {},
  tension: 0
};

/* ---------------------------- 音效 / BGM ---------------------------- */
const S = { ctx: null, master: null, muted: false, nextTime: 0, step: 0 };

function audioInit() {
  if (S.ctx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    S.ctx = new AC();
    S.master = S.ctx.createGain();
    S.master.gain.value = 0.45;
    S.master.connect(S.ctx.destination);
    S.nextTime = S.ctx.currentTime + 0.1;
  } catch (e) { S.ctx = null; }
}
function tone(freq, dur, type, vol, slideTo) {
  if (!S.ctx || S.muted) return;
  try {
    const t0 = S.ctx.currentTime;
    const o = S.ctx.createOscillator(), g = S.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(S.master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) { }
}
function noiseBurst(dur, vol, cutoff) {
  if (!S.ctx || S.muted) return;
  try {
    const t0 = S.ctx.currentTime;
    const len = Math.max(1, Math.floor(S.ctx.sampleRate * dur));
    const buf = S.ctx.createBuffer(1, len, S.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = S.ctx.createBufferSource(); src.buffer = buf;
    const f = S.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff || 900;
    const g = S.ctx.createGain(); g.gain.value = vol || 0.2;
    src.connect(f); f.connect(g); g.connect(S.master); src.start(t0);
  } catch (e) { }
}
function sfx(name, opt) {
  opt = opt || {};
  switch (name) {
    case 'step':     noiseBurst(0.09, 0.10 * (opt.vol || 1), 340); break;
    case 'warn':     tone(170, 0.30, 'sine', 0.09, 250); break;
    case 'switch':   tone(880, 0.05, 'square', 0.09); tone(1320, 0.06, 'square', 0.06); break;
    case 'click':    tone(700, 0.04, 'square', 0.07); break;
    case 'success':  tone(660, 0.09, 'triangle', 0.13); window.setTimeout(function () { tone(990, 0.12, 'triangle', 0.11); }, 80); break;
    case 'catch':    tone(330, 0.20, 'sawtooth', 0.16, 110); noiseBurst(0.25, 0.16, 620); break;
    case 'oops':     tone(240, 0.12, 'square', 0.10, 145); break;
    case 'ring':     tone(1180, 0.16, 'square', 0.09); tone(1480, 0.16, 'square', 0.07); break;
    case 'restore':  tone(520, 0.10, 'triangle', 0.10, 800); break;
    case 'point':    tone(1040, 0.06, 'triangle', 0.09); break;
    case 'turnback': tone(300, 0.25, 'sawtooth', 0.10, 520); break;
    case 'end':      tone(520, 0.20, 'triangle', 0.13); window.setTimeout(function () { tone(392, 0.32, 'triangle', 0.12); }, 170); break;
  }
}
const BGM = { prog: [[220, 262, 330], [175, 220, 262], [196, 247, 294], [165, 208, 247]] };
function bgmTick() {
  if (!S.ctx || S.muted) return;
  try {
    const tempo = 88 + 46 * G.tension;          // 老板越近，节奏越快
    const stepDur = 60 / tempo / 2;
    const now = S.ctx.currentTime;
    if (S.nextTime < now) S.nextTime = now + 0.05;
    let guard = 0;
    while (S.nextTime < now + 0.25 && guard++ < 32) {
      const chord = BGM.prog[Math.floor(S.step / 8) % BGM.prog.length];
      const k = S.step % 8;
      if (k === 0) tone(chord[0] / 2, stepDur * 3.0, 'triangle', 0.09);
      else if (k === 3 || k === 6) tone(chord[1], stepDur * 1.1, 'triangle', 0.045);
      else if (k === 2 || k === 5 || k === 7) tone(chord[2], stepDur * 0.7, 'sine', 0.030);
      if (G.tension > 0.35 && k % 2 === 0) noiseBurst(0.05, 0.02 + 0.03 * G.tension, 3200);
      S.step++; S.nextTime += stepDur;
    }
  } catch (e) { }
}

/* ============================ 游戏逻辑 ============================ */

function rampStats(m) {                       // m = 已上班分钟数
  const c = G.cfg;
  return {
    speed: Math.min(c.speed[1], c.speed[0] + c.speedRamp * m),
    check: Math.min(c.check[1], c.check[0] + c.checkRamp * m),
    spawnMin: Math.max(3.0, c.spawn[0] - c.spawnRamp * m),
    spawnMax: Math.max(4.2, c.spawn[1] - c.spawnRamp * m),
    double: (m >= c.doubleFrom) ? Math.min(0.50, c.doubleChance + 0.05 * (m - c.doubleFrom)) : 0
  };
}
function nextInterval() {
  const s = rampStats(G.t / 60);
  return rnd(s.spawnMin, Math.max(s.spawnMin + 0.8, s.spawnMax));
}

function newGame(key) {
  if (key) G.diffKey = key;
  G.cfg = CFG[G.diffKey];
  G.state = 'playing';
  G.t = 0; G.timeLeft = G.cfg.shift;
  G.points = 70; G.catches = 0; G.combo = 0; G.maxCombo = 0;
  G.success = 0; G.hiddenCount = 0; G.doubleHide = 0;
  G.screen = 'slack'; G.switchAnim = 0; G.slackIdx = 0; G.workIdx = 0; G.sceneT = 0;
  G.items = { noodle: true, phone: true }; G.calmT = 0;
  G.bosses = []; G.warns = []; G.spawnTimer = rnd(3.2, 5.0); G.eventTimer = rnd(16, 24);
  G.blackout = 0; G.ring = 0; G.ringT = 0; G.wave = null;
  G.msgs = []; G.events = []; G.shake = 0; G.flash = 0; G.frozen = false;
  G.outcome = null; G.reason = ''; G.rating = null; G.newAchs = [];
  G.tension = 0; G.saved = loadSave();
  msg('上班了！老板随时会过来，空格切换屏幕', '#ffd166');
}

function msg(text, color) {
  G.msgs.push({ text: text, color: color || '#ffffff', t: 2.4 });
  if (G.msgs.length > 3) G.msgs.shift();
}
function pushEvent(name, opt) { G.events.push({ name: name, opt: opt || {} }); }
function addPoints(d) {
  if (G.state !== 'playing') return;
  G.points = Math.max(0, G.points + d);
  if (G.points <= 0 && !G.outcome) endGame(true, '摸鱼积分归零');
}

function doSwitch() {
  if (G.state !== 'playing') return;
  if (G.blackout > 0) { msg('停电了，先按 R 重启电脑！', '#ffd166'); pushEvent('oops'); return; }
  G.screen = (G.screen === 'slack') ? 'work' : 'slack';
  if (G.screen === 'work') G.workIdx = (G.workIdx + 1) % WORK.length;
  else G.slackIdx = (G.slackIdx + 1) % SLACK.length;
  G.switchAnim = 1;
  pushEvent('switch');
}
function hideNoodle() {
  if (G.state !== 'playing' || !G.items.noodle) return;
  G.items.noodle = false; G.hiddenCount++;
  msg('泡面塞进抽屉了', '#9be7a1'); pushEvent('click');
}
function hidePhone() {
  if (G.state !== 'playing' || !G.items.phone) return;
  G.items.phone = false; G.hiddenCount++;
  msg('手机塞进口袋了', '#9be7a1'); pushEvent('click');
}
function answerPhone() {
  if (G.state !== 'playing' || G.ring <= 0) return;
  G.ring = 0; addPoints(5);
  msg('接起电话：喂，您好！+5', '#9be7a1'); pushEvent('point');
}
function restartPC() {
  if (G.state !== 'playing' || G.blackout <= 0) return;
  G.blackout = 0;
  msg('电脑重启完成，屏幕亮了', '#9be7a1'); pushEvent('restore');
}
function waveBack() {
  if (G.state !== 'playing' || !G.wave || G.wave.answered) return;
  G.wave.answered = true; addPoints(4);
  msg('跟同事挥了挥手 +4', '#9be7a1'); pushEvent('point');
}

/* ---------- 出场警告 / 老板生成 ---------- */
function startWarn(side, delay) {
  G.warns.push({ side: side, t: -(delay || 0), dur: 1.6, stepT: 0 });
  pushEvent('warn');
}
function updateWarns(dt) {
  for (let i = G.warns.length - 1; i >= 0; i--) {
    const w = G.warns[i];
    w.t += dt; w.stepT -= dt;
    if (w.t > 0 && w.stepT <= 0) { w.stepT = 0.30; pushEvent('step', { vol: 0.55 }); }
    if (w.t >= w.dur) { G.warns.splice(i, 1); spawnBoss(w.side); }
  }
}
function spawnBoss(side) {
  const st = rampStats(G.t / 60);
  G.bosses.push({
    side: side, x: side < 0 ? 110 : W - 110, doorX: side < 0 ? 110 : W - 110,
    stopX: side < 0 ? 500 : W - 320, phase: 'walk', phaseT: 0, walkT: 0, stepT: 0,
    speed: st.speed * rnd(0.92, 1.08), checkDur: st.check,
    itemsScored: false, caught: false, turnBackPending: false, turnBackUsed: false,
    leaveT: 0, angry: 0, lean: 0
  });
}
function updateSpawn(dt) {
  if (G.state !== 'playing' || G.warns.length) return;
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0 && G.bosses.length < 2) {
    const st = rampStats(G.t / 60);
    const side = Math.random() < 0.5 ? -1 : 1;
    startWarn(side, 0);
    if (Math.random() < st.double && G.bosses.length === 0) startWarn(-side, 0.45);  // 后期两边同时来
    G.spawnTimer = nextInterval();
  }
}

/* ---------- 老板行为：出现 → 走近 → 停留检查 → 离开 ---------- */
function caughtBy(b) {
  b.caught = true; b.angry = 1.8;
  G.catches++; G.combo = 0; G.shake = 0.65; G.flash = 0.5;
  pushEvent('catch');
  msg('被老板抓到了！(-15 分)', '#ff7b7b');
  addPoints(-15);
  b.phase = 'leave'; b.leaveT = 0; b.turnBackPending = false;
  if (G.state === 'playing' && G.catches >= 3) endGame(true, '被抓 3 次');
}
function successFor(b) {
  G.success++; G.combo++;
  G.maxCombo = Math.max(G.maxCombo, G.combo);
  const gain = 10 + Math.min(G.combo - 1, 4) * 3;
  addPoints(gain);
  pushEvent('success');
  msg('伪装成功 +' + gain + (G.combo > 1 ? '（连击 ' + G.combo + '）' : ''), '#9be7a1');
}
function updateBosses(dt) {
  for (let i = G.bosses.length - 1; i >= 0; i--) {
    const b = G.bosses[i];
    if (b.angry > 0) b.angry -= dt;

    if (b.phase === 'walk') {
      const dir = sign(b.stopX - b.x);
      b.x += dir * b.speed * dt; b.walkT += dt;
      b.lean = lerp(b.lean, 0, Math.min(1, dt * 6));
      b.stepT -= dt;
      if (b.stepT <= 0) { b.stepT = 0.32; pushEvent('step', { vol: 0.6 + 0.4 * G.tension }); }
      if (Math.abs(b.stopX - b.x) < 4) {
        b.x = b.stopX; b.phase = 'check'; b.phaseT = 0; b.itemsScored = false;
        pushEvent('arrive');
      }

    } else if (b.phase === 'check') {
      b.phaseT += dt; b.lean = lerp(b.lean, 1, Math.min(1, dt * 8));
      if (!b.itemsScored) {
        b.itemsScored = true;
        let pen = 0;
        if (G.items.noodle) pen += 8;
        if (G.items.phone) pen += 8;
        if (pen > 0) {
          const what = (G.items.noodle && G.items.phone) ? '泡面和手机' : (G.items.noodle ? '泡面' : '手机');
          addPoints(-pen);
          pushEvent('oops');
          msg('老板瞟见了' + what + ' -' + pen, '#ffb4b4');
        } else {
          G.doubleHide++;
          msg('桌面干干净净，老板没话说', '#9be7a1');
        }
      }
      if (!b.caught && G.blackout <= 0 && G.screen === 'slack' && b.phaseT > 0.35) caughtBy(b);
      if (!b.caught && b.phaseT >= b.checkDur) {
        if (G.blackout > 0) { msg('屏幕黑着，老板皱了皱眉', '#cfd8e3'); pushEvent('oops'); }
        else successFor(b);
        if (G.state !== 'playing') return;
        b.phase = 'leave'; b.leaveT = 0;
        const tb = G.cfg.events.turnBack * (1 + 0.45 * (G.t / 60));
        b.turnBackPending = (!b.turnBackUsed && Math.random() < Math.min(0.45, tb));
      }

    } else if (b.phase === 'leave') {
      b.leaveT += dt;
      b.lean = lerp(b.lean, 0, Math.min(1, dt * 5));
      const dir = sign(b.doorX - b.x);
      b.x += dir * b.speed * 1.25 * dt;
      if (b.turnBackPending && b.leaveT > 0.55) {          // 老板突然回头
        b.turnBackPending = false; b.turnBackUsed = true;
        b.phase = 'walk'; b.checkDur = Math.max(0.9, b.checkDur * 0.72);
        msg('老板突然回头！', '#ff9f43'); pushEvent('turnback');
      } else if (Math.abs(b.doorX - b.x) < 12 || b.x < -80 || b.x > W + 80) {
        G.bosses.splice(i, 1);
      }
    }
  }
}

/* ---------- 随机事件：电话 / 停电 / 同事路过打招呼 ---------- */
function updateEvents(dt) {
  if (G.ring > 0) {
    G.ring -= dt; G.ringT += dt;
    if (G.ringT > 0.9) { G.ringT = 0; pushEvent('ring'); }
    if (G.ring <= 0) { G.ring = 0; addPoints(-12); msg('没接电话，被记了一笔 -12', '#ff8f8f'); }
  }
  if (G.blackout > 0) {
    G.blackout -= dt;
    if (G.blackout <= 0) { G.blackout = 0; msg('来电了，屏幕自己亮了', '#9be7a1'); pushEvent('restore'); }
  }
  if (G.wave) {
    const w = G.wave;
    w.x += w.dir * 130 * dt; w.t -= dt;
    if (w.answered) w.waveT += dt;
    if (w.t <= 0 || w.x < -140 || w.x > W + 140) G.wave = null;
  }
  if (G.state !== 'playing') return;
  if (G.ring > 0 || G.blackout > 0 || G.wave) return;
  G.eventTimer -= dt;
  if (G.eventTimer <= 0) {
    G.eventTimer = rnd(17, 28);
    const e = G.cfg.events, total = e.ring + e.blackout + e.wave, r = Math.random() * total;
    if (r < e.ring) { G.ring = 4.0; G.ringT = 0; msg('电话响了！按 P 接听', '#ffd166'); pushEvent('ring'); }
    else if (r < e.ring + e.blackout) { G.blackout = 4.5; msg('停电了！按 R 重启电脑', '#ffd166'); pushEvent('warn'); }
    else {
      const side = Math.random() < 0.5 ? -1 : 1;
      G.wave = { x: side < 0 ? -70 : W + 70, dir: -side, t: 5.0, answered: false, waveT: 0 };
      msg('同事路过，按 H 打招呼', '#8fd0ff');
    }
  }
}

/* ---------- 桌面小物件自动复位 / 紧张度 ---------- */
function updateItems(dt) {
  const busy = G.bosses.length > 0 || G.warns.length > 0;
  if (busy) { G.calmT = 0; return; }
  G.calmT += dt;
  if (G.calmT > 1.3 && (!G.items.noodle || !G.items.phone)) {
    G.items.noodle = true; G.items.phone = true;
    pushEvent('restore');
    msg('老板走了，泡面和手机又摆了出来', '#8fd0ff');
  }
}
function updateTension() {
  let t = 0;
  for (let i = 0; i < G.bosses.length; i++) {
    const b = G.bosses[i];
    const near = (b.phase === 'check') ? 1 : clamp(1 - Math.abs(b.x - b.stopX) / 430, 0, 1);
    t = Math.max(t, near);
  }
  if (G.warns.length) t = Math.max(t, 0.35);
  G.tension = clamp(t, 0, 1);
}

/* ---------- 评级 / 结算 ---------- */
function ratingFor(points, catches, outcome) {
  if (outcome === 'fired') return { title: '被开除', emoji: '📦', color: '#ff7b7b', desc: '工位已清空，明天不用来了。' };
  if (points >= 800) return { title: '摸鱼大师', emoji: '👑', color: '#ffd166', desc: '老板在你身后站了一整天，什么都没看出来。' };
  if (points >= 450) return { title: '摸鱼高手', emoji: '😎', color: '#9be7a1', desc: '摸鱼和工作，你掌握了完美的平衡。' };
  if (points >= 200) return { title: '普通社畜', emoji: '🙂', color: '#8fd0ff', desc: '安全下班，今天也是平平无奇的一天。' };
  return { title: '摸鱼小白', emoji: '😅', color: '#cfd8e3', desc: '还没摸明白，下班铃就响了。' };
}
function endGame(fired, reason) {
  if (G.outcome) return;
  G.outcome = fired ? 'fired' : 'survived';
  G.reason = reason || '';
  G.state = 'result';
  G.rating = ratingFor(G.points, G.catches, G.outcome);
  pushEvent('end');

  const s = loadSave();
  const newly = [];
  function unlock(id) {
    if (!s.achs) s.achs = {};
    if (!s.achs[id]) { s.achs[id] = 1; newly.push(id); }
  }
  if (G.outcome === 'survived' && G.points >= G.cfg.quota) unlock('survivor');
  if (G.outcome === 'survived' && G.catches === 0) unlock('never_caught');
  if (G.points >= 800) unlock('slack_master');
  if (G.doubleHide >= 3) unlock('actor');
  if (G.maxCombo >= 5) unlock('combo');
  if (G.outcome === 'fired') unlock('fired');
  s.best = Math.max(s.best || 0, G.points);
  s.exp = (s.exp || 0) + G.points;                    // 简化版进程解锁：累计经验
  s.level = Math.floor(s.exp / 1500) + 1;
  saveSave(s);
  G.saved = s;
  G.newAchs = newly;
}

/* ---------- 主逻辑步进（与渲染解耦，可无头自测） ---------- */
function stepGame(dt) {
  G.sceneT += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 2.2);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 3.0);
  for (let i = 0; i < G.msgs.length; i++) G.msgs[i].t -= dt;
  G.msgs = G.msgs.filter(function (m) { return m.t > 0; });

  if (G.state !== 'playing') return;

  G.t += dt; G.timeLeft -= dt;
  if (G.switchAnim > 0) G.switchAnim = Math.max(0, G.switchAnim - dt / 0.22);

  updateSpawn(dt);
  updateWarns(dt);
  updateBosses(dt);
  updateEvents(dt);
  updateItems(dt);
  updateTension();

  if (G.timeLeft <= 0 && !G.outcome) { G.timeLeft = 0; endGame(false); }
}

      { color: G.items.noodle ? '#8a5a2b' : '#2f3b4a', size: 17, disabled: !G.items.noodle });
    btn(232, 646, 180, 50, G.items.phone ? '收手机 (2)' : '手机已收', 'phone',
      { color: G.items.phone ? '#2f5a8a' : '#2f3b4a', size: 17, disabled: !G.items.phone });
    btn(430, 640, 380, 62, work ? '当前：认真工作中 → 切回摸鱼' : '当前：摸鱼中 → 切到工作', 'switch',
      { color: work ? '#2b5797' : '#c9822b', size: 20, sub: '空格 / Tab / 点击' });
    let cx = 828;
    if (G.ring > 0) { btn(cx, 646, 160, 50, '接电话 (P)', 'answer', { color: '#c0392b', size: 17, pulse: true }); cx += 172; }
    if (G.blackout > 0) { btn(cx, 646, 160, 50, '重启电脑 (R)', 'restart', { color: '#2b5797', size: 17, pulse: true }); cx += 172; }
    if (G.wave && !G.wave.answered) { btn(cx, 646, 160, 50, '打招呼 (H)', 'wave', { color: '#2f6f4f', size: 17 }); cx += 172; }
    btn(W - 206, 646, 80, 50, '重开', 'restartgame', { color: '#3a2f3f', size: 15 });
    btn(W - 118, 646, 100, 50, '菜单', 'menu', { color: '#3a2f3f', size: 15 });
    btn(W - 168, 22, 42, 42, S.muted ? '🔇' : '🔊', 'mute', { color: 'rgba(255,255,255,.12)', size: 18 });
    btn(W - 120, 22, 42, 42, 'II', 'pause', { color: 'rgba(255,255,255,.12)', size: 16 });
  } else if (G.state === 'paused') {
    btn(490, 400, 300, 56, '继续（Esc）', 'pause', { color: '#2b5797', size: 20 });
    btn(490, 468, 300, 50, '重开一局', 'restartgame', { color: '#8a5a2b', size: 17 });
    btn(490, 528, 300, 50, '返回菜单', 'menu', { color: '#3a2f3f', size: 17 });
  } else if (G.state === 'result') {
    btn(380, 620, 240, 56, '再玩一次', 'restartgame', { color: '#e0523f', size: 20 });
    btn(650, 620, 240, 56, '换个难度', 'menu', { color: '#2f3b4a', size: 20 });
  }
}
function doAction(a) {
  audioInit();
  if (S.ctx && S.ctx.state === 'suspended') S.ctx.resume();
  if (a.indexOf('diff:') === 0) { G.diffKey = a.slice(5); pushEvent('click'); return; }
  switch (a) {
    case 'start': newGame(G.diffKey); break;
    case 'switch': doSwitch(); break;
    case 'noodle': hideNoodle(); break;
    case 'phone': hidePhone(); break;
    case 'answer': answerPhone(); break;
    case 'restart': restartPC(); break;
    case 'wave': waveBack(); break;
    case 'pause': G.state = (G.state === 'paused') ? 'playing' : 'paused'; pushEvent('click'); break;
    case 'mute': S.muted = !S.muted; break;
    case 'menu': G.state = 'menu'; G.saved = loadSave(); pushEvent('click'); break;
    case 'restartgame': newGame(G.diffKey); break;
  }
}
function toWorld(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
}
cv.addEventListener('pointermove', function (e) { const p = toWorld(e); P.x = p.x; P.y = p.y; });
cv.addEventListener('pointerdown', function (e) {
  const p = toWorld(e); P.x = p.x; P.y = p.y;
  audioInit();
  if (S.ctx && S.ctx.state === 'suspended') S.ctx.resume();
  for (let i = G.buttons.length - 1; i >= 0; i--) {
    const b = G.buttons[i];
    if (!b.disabled && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { doAction(b.action); return; }
  }
});
cv.addEventListener('pointerleave', function () { P.x = -1; P.y = -1; });
window.addEventListener('keydown', function (e) {
  audioInit();
  if (S.ctx && S.ctx.state === 'suspended') S.ctx.resume();
  const k = e.key;
  if (e.code === 'Space' || e.code === 'Tab' || k === ' ') {
    e.preventDefault();
    if (G.state === 'menu' || G.state === 'result') newGame(G.diffKey);
    else if (G.state === 'paused') G.state = 'playing';
    else doSwitch();
    return;
  }
  if (k === '1') hideNoodle();
  else if (k === '2') hidePhone();
  else if (k === 'p' || k === 'P') answerPhone();
  else if (k === 'r' || k === 'R') restartPC();
  else if (k === 'h' || k === 'H') waveBack();
  else if (k === 'm' || k === 'M') S.muted = !S.muted;
  else if (k === 'Escape') { if (G.state === 'playing') G.state = 'paused'; else if (G.state === 'paused') G.state = 'playing'; }
  else if (k === 'Enter') { if (G.state === 'menu' || G.state === 'result') newGame(G.diffKey); }
});

/* ---------------- 渲染 & 主循环 ---------------- */
function render() {
  buildButtons();
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (G.shake > 0) ctx.translate(rnd(-1, 1) * G.shake * 12, rnd(-1, 1) * G.shake * 9);
  drawRoom();
  drawColleague();
  drawBosses();
  drawPlayerBehind();
  drawDesk();
  drawMonitor();
  drawDeskItems();
  drawHands();
  ctx.restore();

  drawVignette();
  drawWarnings();
  drawHUD();
  if (G.state === 'menu') { drawMenu(); drawButtons(); }
  else if (G.state === 'paused') { drawPaused(); drawButtons(); }
  else if (G.state === 'result') { drawResult(); drawButtons(); }
  else { drawMessages(); drawButtons(); }
}
function consumeEvents() {
  for (let i = 0; i < G.events.length; i++) sfx(G.events[i].name, G.events[i].opt);
  G.events.length = 0;
}
let lastT = (window.performance && performance.now) ? performance.now() : Date.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (!G.frozen) stepGame(dt);
  consumeEvents();
  bgmTick();
  render();
  requestAnimationFrame(frame);
}

/* ============================ 内置自测 ============================ */
function autopilot() {                        // 模拟一个完美玩家（自测用）
  const threat = (G.bosses.length > 0 || G.warns.length > 0);
  if (threat) {
    if (G.screen !== 'work') doSwitch();
    hideNoodle(); hidePhone();
  } else if (G.screen !== 'slack') doSwitch();
  answerPhone();
  restartPC();
}
function scenario(opts) {
  newGame('normal');
  G.spawnTimer = 9999; G.eventTimer = 9999; G.warns = []; G.bosses = [];
  if (opts.items !== undefined) G.items = { noodle: !!opts.items, phone: !!opts.items };
  if (opts.screen) G.screen = opts.screen;
  if (opts.blackout) G.blackout = opts.blackout;
  const st = rampStats(0);
  const b = {
    side: -1, x: 500, doorX: 110, stopX: 500, phase: 'check', phaseT: 0, walkT: 0, stepT: 0,
    speed: st.speed, checkDur: opts.checkDur || 1.4, itemsScored: false, caught: false,
    turnBackPending: false, turnBackUsed: false, leaveT: 0, angry: 0, lean: 1
  };
  G.bosses = [b];
  return b;
}
function runSelfTest() {
  const R = [];
  let fails = 0;
  // 自测会跑完整局并结算，先把玩家存档备份起来，测完还原，避免污染成就/经验
  let saveBackup = null;
  try { saveBackup = localStorage.getItem(SAVE_KEY); } catch (e) { }
  function ck(name, cond, extra) {
    R.push((cond ? 'PASS' : 'FAIL') + ' | ' + name + (extra ? ('  [' + extra + ']') : ''));
    if (!cond) fails++;
  }
  function run(sec, dt, pilot) {
    const n = Math.max(1, Math.round(sec / dt));
    for (let i = 0; i < n; i++) {
      if (pilot) pilot();
      stepGame(dt);
      G.events.length = 0;                    // 自测不播音，顺便避免事件堆积
      if (G.state !== 'playing') return;
    }
  }

  ck('三种难度配置齐全', !!(CFG.easy && CFG.normal && CFG.hard && CFG.easy.shift && CFG.hard.quota));

  newGame('normal');
  const s0 = rampStats(0), s5 = rampStats(5);
  ck('老板速度随时间递增', s5.speed > s0.speed, s0.speed.toFixed(0) + ' -> ' + s5.speed.toFixed(0));
  ck('出场间隔随时间缩短', s5.spawnMax < s0.spawnMax, s0.spawnMax.toFixed(1) + ' -> ' + s5.spawnMax.toFixed(1));
  ck('检查停留随时间变长', s5.check > s0.check, s0.check.toFixed(2) + ' -> ' + s5.check.toFixed(2));
  ck('后期开启双老板概率', rampStats(0).double === 0 && rampStats(5).double > 0);

  newGame('normal');
  const before = G.screen;
  doSwitch();
  ck('切换可在摸鱼/工作之间翻转', G.screen !== before);
  ck('切换会触发动画', G.switchAnim > 0);

  newGame('normal');
  G.blackout = 2;
  const sBefore = G.screen;
  doSwitch();
  ck('停电时无法切换屏幕', G.screen === sBefore);
  restartPC();
  ck('按 R 可以重启电脑恢复', G.blackout === 0);
  doSwitch();
  ck('重启后可以正常切换', G.screen !== sBefore);

  scenario({ screen: 'work', items: false });
  const p0 = G.points;
  run(2.0, 1 / 60);
  ck('工作屏幕通过检查并加分', G.points > p0 && G.success >= 1 && G.catches === 0,
     'points ' + p0 + ' -> ' + G.points + ', success ' + G.success);

  scenario({ screen: 'slack', items: false });
  run(1.2, 1 / 60);
  ck('摸鱼屏幕被老板抓到', G.catches === 1, 'catches=' + G.catches);

  scenario({ screen: 'work', items: true });
  const p1 = G.points;
  run(0.6, 1 / 60);
  ck('泡面和手机都摆着被扣 16 分', G.points === p1 - 16, 'points ' + p1 + ' -> ' + G.points);

  scenario({ screen: 'work', items: false });
  const p2 = G.points, dh = G.doubleHide;
  run(0.6, 1 / 60);
  ck('桌面干净不扣分且计入影帝', G.points === p2 && G.doubleHide === dh + 1);

  scenario({ screen: 'slack', items: false, blackout: 3 });
  run(1.0, 1 / 60);
  ck('停电黑屏时不会被抓', G.catches === 0, 'catches=' + G.catches);

  newGame('normal');
  G.spawnTimer = 9999; G.eventTimer = 9999; G.ring = 1.0;
  const p3 = G.points;
  run(1.2, 1 / 60);
  ck('电话没接扣 12 分', G.ring === 0 && G.points === p3 - 12, 'points ' + p3 + ' -> ' + G.points);
  newGame('normal');
  G.spawnTimer = 9999; G.eventTimer = 9999; G.ring = 3.0;
  const p4 = G.points;
  answerPhone();
  ck('及时接电话加分', G.ring === 0 && G.points === p4 + 5);

  const b = scenario({ screen: 'work', items: false, checkDur: 1.0 });
  run(1.2, 1 / 60);
  ck('检查结束后老板离开', b.phase === 'leave', 'phase=' + b.phase);
  b.turnBackPending = true;
  run(1.5, 1 / 60);
  ck('突然回头会再次进入检查', b.turnBackUsed === true && (b.phase === 'check' || b.phase === 'leave'), 'phase=' + b.phase);

  ck('评级：被开除', ratingFor(0, 3, 'fired').title === '被开除');
  ck('评级：摸鱼大师', ratingFor(850, 0, 'survived').title === '摸鱼大师');
  ck('评级：摸鱼高手', ratingFor(500, 1, 'survived').title === '摸鱼高手');
  ck('评级：普通社畜', ratingFor(250, 1, 'survived').title === '普通社畜');
  ck('评级：摸鱼小白', ratingFor(120, 1, 'survived').title === '摸鱼小白');

  newGame('normal');
  let maxBosses = 0;
  const pilot = function () { autopilot(); if (G.bosses.length > maxBosses) maxBosses = G.bosses.length; };
  run(CFG.normal.shift + 2, 1 / 30, pilot);
  ck('完美玩家能坚持到下班', G.outcome === 'survived', 'outcome=' + G.outcome + ' t=' + G.t.toFixed(0));
  ck('完美玩家零被抓', G.catches === 0, 'catches=' + G.catches);
  ck('完美玩家达成摸鱼指标', G.points >= CFG.normal.quota, 'points=' + G.points);
  ck('一局内成功伪装次数合理', G.success >= 10, 'success=' + G.success);
  ck('同时最多两个老板', maxBosses <= 2, 'max=' + maxBosses);
  ck('结算评级非空', !!G.rating && !!G.rating.title, G.rating && G.rating.title);
  ck('成就：成功下班/从未被抓', !!(G.saved.achs && G.saved.achs.survivor && G.saved.achs.never_caught));
  ck('经验值/等级已累计', (G.saved.exp || 0) > 0 && (G.saved.level || 0) >= 1,
     'exp=' + G.saved.exp + ' lv=' + G.saved.level);

  newGame('normal');
  run(CFG.normal.shift + 2, 1 / 30, null);
  ck('完全不伪装的玩家被开除', G.outcome === 'fired',
     'outcome=' + G.outcome + ', catches=' + G.catches + ', points=' + G.points);

  let crashed = null;
  try {
    newGame('hard');
    run(40, 0.5, autopilot);
    G.state = 'playing';
    stepGame(0); stepGame(0.001);
  } catch (e) { crashed = e && e.message; }
  ck('大时间步长/极端参数下不报错', !crashed, crashed || 'ok');

  G.state = 'menu';
  try {
    if (saveBackup === null) localStorage.removeItem(SAVE_KEY);
    else localStorage.setItem(SAVE_KEY, saveBackup);
  } catch (e) { }
  G.saved = loadSave();
  const pre = document.getElementById('selftest-result');
  pre.hidden = false;
  pre.textContent = R.join('\n') + '\n--- ' + (fails ? ('SELFTEST FAIL (' + fails + ')') : 'SELFTEST PASS') + ' ---';
  document.title = fails ? ('SELFTEST FAIL ' + fails) : 'SELFTEST PASS';
}

/* ---------------- 启动 ---------------- */
G.saved = loadSave();
if (Q.has('selftest')) {
  runSelfTest();
} else {
  if (Q.has('auto') || Q.has('boss')) { newGame(Q.get('diff') || 'normal'); G.state = 'playing'; }
  if (Q.has('boss')) {                        // 用于截图核对：直接摆出「老板正在检查」的画面
    G.timeLeft = G.cfg.shift * 0.55; G.points = 188; G.success = 9; G.combo = 3; G.maxCombo = 4;
    G.catches = 1; G.items.noodle = false; G.screen = 'slack';
    G.bosses = []; G.warns = [];
    const st = rampStats(G.t / 60);
    G.bosses.push({
      side: -1, x: 500, doorX: 110, stopX: 500, phase: 'check', phaseT: 0.8, walkT: 0,
      stepT: 0, speed: st.speed, checkDur: 6, itemsScored: true, caught: false,
      turnBackPending: false, turnBackUsed: true, leaveT: 0, angry: 0, lean: 1
    });
    G.tension = 0.9; G.ring = 2.4; G.ringT = 0;
    msg('老板正在检查屏幕！', '#ff9f43');
  }
  if (Q.has('freeze')) G.frozen = true;
  requestAnimationFrame(frame);
}
</script>
